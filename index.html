.badge{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.35);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.btn{display:block;width:calc(100% - 48px);margin:22px 24px 0;border:0;border-radius:16px;background:var(--pri2);color:#fff;font-size:17px;font-weight:700;padding:16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--line)}
.q{padding:20px}.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0 22px}
.bar b{display:block;height:100%;background:var(--pri2);border-radius:8px;transition:width .35s}
.q h2{font-size:21px;line-height:1.3;margin:0 0 18px}.mut{color:var(--mut);font-size:14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;font:inherit;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--pri)}.opt.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,var(--card))}
.opt span{flex:0 0 32px;height:32px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.on span{background:var(--pri2);color:#fff}
.skip{display:block;width:100%;background:none;border:1.5px dashed var(--line);color:var(--mut);border-radius:14px;padding:12px;font:inherit;cursor:pointer;margin:4px 0 8px}.skip:hover{color:var(--pri);border-color:var(--pri)}
.back{background:none;border:0;color:var(--pri);font:inherit;padding:8px 0;cursor:pointer}
.res{padding:20px 16px 0}.res h2{margin:0 8px 4px;font-size:26px}
.card{background:var(--card);border-radius:20px;overflow:hidden;margin:16px 0;box-shadow:0 2px 12px rgba(20,33,61,.1);animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.cb{padding:16px}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.row h3{margin:0;font-size:18px;line-height:1.25}.pct{font-size:32px;font-weight:800;line-height:1}
.meter{height:10px;border-radius:10px;overflow:hidden;margin:12px 0}.meter b{display:block;height:100%;width:0;border-radius:10px;transition:width 1s cubic-bezier(.2,.8,.2,1)}

.h{font-weight:700;margin:12px 0 6px;font-size:14px}.note{margin:8px 12px 0;font-size:13px}

function plan(first){const all=Q.map((q,i)=>({q:i,o:q.o.map((_,k)=>k)})),gen=all.filter(x=>!Q[x.q].g);if(first<0)return gen;const grp=grpOf(first);if(!grp)return gen;const f=G[grp],p=[all[0]];for(let i=1;i<Q.length;i++){const g=Q[i].g;if(g){if(g===grp)p.push(all[i]);continue}const o=[];Q[i].o.forEach((x,k)=>{if(Object.keys(x.w).some(z=>f.includes(z)))o.push(k)});if(o.length>=2)p.push({q:i,o})}return p}
function calc(){const sc={},bt={},rs={};s.n=0;s.p.forEach(st=>{const a=s.a[st.q];if(a<0)return;s.n++;const m={};st.o.forEach(k=>{const w=Q[st.q].o[k].w;for(const z in w)m[z]=Math.max(m[z]||0,w[z])});for(const z in m)bt[z]=(bt[z]||0)+m[z];const oo=Q[st.q].o[a],w=oo.w;for(const z in w){sc[z]=(sc[z]||0)+w[z];(rs[z]=rs[z]||[]).push({w:w[z],t:oo.t})}});
return F.filter(f=>{const g=grpOf(s.a[0]);return !g||G[g].includes(f.id)}).map(f=>({f,r:(rs[f.id]||[]).filter(x=>x.w>=2).sort((x,y)=>y.w-x.w).slice(0,3).map(x=>x.t),s:sc[f.id]||0,p:bt[f.id]?Math.round(100*(sc[f.id]||0)/bt[f.id]):0})).sort((x,y)=>y.p-x.p||y.s-x.s)}
